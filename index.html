<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

    <title>Tech Store</title>
</head>

<body class="bg-gray-100">


    <header class="bg-blue-600 text-white p-5">
        <h1 class="text-3xl font-bold text-center">
            Tech Store
        </h1>
    </header>

    <main class="max-w-5xl mx-auto p-6">

        <h2 class="text-2xl font-bold mb-6">
            Nossos produtos
        </h2>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

            <div class="bg-white rounded-lg shadow p-4">

                <img
                    src="https://images.unsplash.com/photo-1541807084-5c52b6b3adef?w=500"
                    alt="Notebook"
                    class="w-full h-48 object-cover rounded">

                <h3 class="text-xl font-bold mt-4">
                    Notebook
                </h3>

                <p class="text-gray-600 mt-2">
                    Notebook para estudos e trabalho.
                </p>

                <p class="text-xl font-bold text-blue-600 mt-3">
                    R$ 2.999,90
                </p>

                <button
                    onclick="adicionarCarrinho()"
                    class="bg-blue-600 text-white w-full py-2 rounded mt-4 hover:bg-blue-700">
                    Comprar
                </button>

            </div>

            <div class="bg-white rounded-lg shadow p-4">

                <img
                    src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500"
                    alt="Smartphone"
                    class="w-full h-48 object-cover rounded">

                <h3 class="text-xl font-bold mt-4">
                    Smartphone
                </h3>

                <p class="text-gray-600 mt-2">
                    Smartphone moderno e rápido.
                </p>

                <p class="text-xl font-bold text-blue-600 mt-3">
                    R$ 1.899,90
                </p>

                <button
                    onclick="adicionarCarrinho()"
                    class="bg-blue-600 text-white w-full py-2 rounded mt-4 hover:bg-blue-700">
                    Comprar
                </button>

            </div>

            <div class="bg-white rounded-lg shadow p-4">

                <img
                    src="https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=500"
                    alt="Fone de ouvido"
                    class="w-full h-48 object-cover rounded">

                <h3 class="text-xl font-bold mt-4">
                    Fone Bluetooth
                </h3>

                <p class="text-gray-600 mt-2">
                    Fone com som de alta qualidade.
                </p>

                <p class="text-xl font-bold text-blue-600 mt-3">
                    R$ 249,90
                </p>

                <button
                    onclick="adicionarCarrinho()"
                    class="bg-blue-600 text-white w-full py-2 rounded mt-4 hover:bg-blue-700">
                    Comprar
                </button>

            </div>

        </div>

        <div class="bg-white rounded-lg shadow p-5 mt-8">

            <h2 class="text-xl font-bold">
                Carrinho
            </h2>

            <p class="mt-2">
                Produtos adicionados:
                <span id="quantidade" class="font-bold">0</span>
            </p>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
